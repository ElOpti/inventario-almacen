# =======================================================
# CONFIGURACIÓN PRINCIPAL - SISTEMA DE INVENTARIO
# =======================================================
spring.application.name=inventario-almacen
server.port=8080

# Perfil activo: por defecto 'default' (H2 embebido para ejecución instantánea sin prerrequisitos)
# Para usar MySQL: descomentar la siguiente línea o ejecutar con --spring.profiles.active=mysql
# spring.profiles.active=mysql

# Para usar SQL Server: descomentar la siguiente línea o ejecutar con --spring.profiles.active=sqlserver
# spring.profiles.active=sqlserver

# Configuración Base de Datos por defecto (H2 en memoria con compatibilidad)
spring.datasource.url=jdbc:h2:mem:inventariodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 para depuración
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
