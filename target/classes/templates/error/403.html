<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: header_head('Acceso Denegado')}">
    <title>Acceso No Autorizado - 403</title>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <!-- Contenido Principal -->
    <main class="container-fluid px-4 py-4 main-content">
        
        <div class="row justify-content-center py-5">
            <div class="col-md-7 col-lg-6 text-center">
                <div class="card shadow border-0 p-4 p-md-5">
                    <div class="mb-3">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle p-4">
                            <i class="bi bi-shield-x text-danger display-3"></i>
                        </div>
                    </div>
                    
                    <h2 class="fw-bold text-dark mb-2">Acceso No Autorizado (403)</h2>
                    <p class="text-muted mb-4">
                        Su rol actual no cuenta con los permisos necesarios para acceder o ejecutar acciones en este módulo, de acuerdo con la matriz de seguridad del almacén.
                    </p>

                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/dashboard}" class="btn btn-primary btn-primary-custom px-4 py-2">
                            <i class="bi bi-house-door-fill me-1"></i> Ir a Mi Panel Autorizado
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Pie de Página y Scripts -->
    <footer th:replace="~{layout/base :: footer}"></footer>
    <div th:replace="~{layout/base :: scripts}"></div>

</body>
</html>
